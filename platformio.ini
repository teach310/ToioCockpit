; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; 役割ごとに env を分ける。src/<役割>/ をその env だけでビルドする
;   cockpit : CoreS3。運転席（メイン）
;   (予定) shovel : AtomS3。ショベル (#13)
;   (予定) pedal  : Core2。アクセル (#12)
[platformio]
default_envs = cockpit

; 全 env で共通の設定
[env]
platform = espressif32
framework = arduino
upload_speed = 115200

[env:cockpit]
board = m5stack-cores3
build_src_filter = +<cockpit/>
lib_deps =
	m5stack/M5Unified@^0.2.7
	kenichi884/M5StackToio@^1.0.4
	h2zero/NimBLE-Arduino@1.4.3
	https://github.com/m5stack/M5Unit-Joystick2.git#b8ef71b8d5b7933934c7a2c93b28832a35592073

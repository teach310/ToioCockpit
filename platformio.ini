; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; 役割ごとに env を分ける。src/<役割>/ をその env だけでビルドする
;   cockpit : Core2（M5GO Bottom2 付き）。運転席（メイン）
;   shovel  : AtomS3。toio に載せるショベル (#13)
;   pedal   : ATOM Lite。圧力センサーのアクセル (#12)。今はセンサーのテストだけ
; 複数の env で使うコード（BLE の決まりごとなど）は lib/ に置く
[platformio]
default_envs = cockpit

; 全 env で共通の設定
[env]
platform = espressif32
framework = arduino
upload_speed = 115200

[env:cockpit]
board = m5stack-core2
build_src_filter = +<cockpit/>
monitor_speed = 115200
; NimBLE-Arduino は 1.4.3 に固定する。M5StackToio が 2.x 系に対応していないため（M5StackToio の README_jp.md に記載）
lib_deps =
	m5stack/M5Unified@^0.2.7
	kenichi884/M5StackToio@^1.0.4
	h2zero/NimBLE-Arduino@1.4.3
	https://github.com/m5stack/M5Unit-Joystick2.git#b8ef71b8d5b7933934c7a2c93b28832a35592073

[env:shovel]
board = m5stack-atoms3
build_src_filter = +<shovel/>
; shovel は M5StackToio を使わないが、BLE の書き方を cockpit とそろえるため同じ 1.4.3 にする
; M5StackToio が 2.x に対応したら、cockpit と一緒に上げる
lib_deps =
	m5stack/M5Unified@^0.2.7
	h2zero/NimBLE-Arduino@1.4.3
	madhephaestus/ESP32Servo@^3.2.1

[env:pedal]
board = m5stack-atom
build_src_filter = +<pedal/>
monitor_speed = 115200
lib_deps = 
	m5stack/M5Unified@^0.2.7
